app = "flaptap"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3333"
  HOST = "0.0.0.0"
  TRUST_PROXY = "1"
  FLAPTAP_SQLITE_PATH = "/app/data/flaptap.sqlite"

[[mounts]]
  source = "flaptap_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
