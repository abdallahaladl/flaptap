services:
  - type: web
    name: flaptap
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3333"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: FLAPTAP_SQLITE_PATH
        value: /app/data/flaptap.sqlite
      - key: OPENCODE_GO_MODEL
        value: deepseek-v4.1-flash
      - key: OPENCODE_GO_BASE_URL
        value: https://opencode.ai/inference/go/openai/v1
      - key: OPENCODE_GO_API_KEY
        sync: false
